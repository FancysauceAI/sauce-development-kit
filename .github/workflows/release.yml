name: Release
on:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # npm exchanges this for a short-lived publish credential (trusted
      # publishing) and signs the provenance statement with it.
      id-token: write
    steps:
      # No step here pushes with the checkout's token: changesets/action writes
      # its own git credentials from the token it is handed below. Leaving the
      # checkout token on disk would give every later step — and anything they
      # run — a repository write credential nothing asks for.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      # `pnpm publish` hands the tarball to the npm CLI, and trusted publishing
      # needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - run: npm install -g npm@11.6.2
      - run: pnpm install --frozen-lockfile
      # The release pull request is opened as the app, not as `GITHUB_TOKEN`:
      # events raised by `GITHUB_TOKEN` never start a workflow, so a release
      # pull request opened with it would sit with no CI run at all.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          pr-title: "chore: release"
          commit-message: "chore: release"
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          # npm tries trusted publishing first and falls back to this token, which
          # setup-node wrote into the `.npmrc` it generated for `registry-url`.
          # The token exists only to publish a package's first version, before
          # npmjs lets a trusted publisher be configured; delete the secret once
          # one is (see RELEASING.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
