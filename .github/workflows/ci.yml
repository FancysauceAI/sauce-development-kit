name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Present so a merge queue, if one is ever enabled, runs these checks on the
  # queued group rather than skipping straight to merge.
  merge_group:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # These versions are baked into the branch-protection required-check names
      # `checks (22)` and `checks (24)`. Change the matrix and the required
      # checks together, or merges block on a check that can never report.
      matrix: { node: [22, 24] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:internal-refs
      - name: Check commit messages and PR body for internal references
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git log --format=%B "origin/${BASE_REF}..HEAD" > "${RUNNER_TEMP}/commits.txt"
          node scripts/check-internal-refs.mjs "${RUNNER_TEMP}/commits.txt"
          printf '%s' "$BODY" | node scripts/check-internal-refs.mjs --stdin
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
  # Deliberately not a required check: an advisory against a transitive dev
  # dependency would otherwise block every unrelated pull request.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
  # The action image bundles `@commitlint/config-conventional`, so this job needs
  # no install step to resolve the config named below.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The action lists the PR's commits through the API; `contents: read` alone
    # returns "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with: { configFile: .commitlintrc.json }
  # Report-only: `--exit-code 0` keeps a finding from failing the run while the
  # allow-list in `.gitleaks.toml` is proven out; a scan error still fails it.
  # Findings land in the job summary and a SARIF artifact. Drop the flag to block.
  # The release binary is used rather than gitleaks-action, which needs a
  # license key for organization-owned repositories.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt in the v8.30.1 release, for the
      # linux_x64 tarball. Update with GITLEAKS_VERSION.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          args=(git --config .gitleaks.toml --redact --no-banner --exit-code 0
            --report-format sarif --report-path gitleaks.sarif)
          # A pull request scans only its own commits; every other event scans
          # the full history.
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          "${RUNNER_TEMP}/gitleaks" "${args[@]}" 2>&1 | tee gitleaks.log
          {
            echo "### gitleaks"
            echo "Findings: $(jq '[.runs[].results[]] | length' gitleaks.sarif)"
            grep -o '[0-9]* commits scanned' gitleaks.log | sed 's/^/Scanned: /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: gitleaks-sarif, path: gitleaks.sarif, if-no-files-found: ignore }
