name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Present so a merge queue, if one is ever enabled, runs these checks on the
  # queued group rather than skipping straight to merge.
  merge_group:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # These versions are baked into the branch-protection required-check names
      # `checks (22)` and `checks (24)`. Change the matrix and the required
      # checks together, or merges block on a check that can never report.
      matrix: { node: [22, 24] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:internal-refs
      - name: Check commit messages and PR body for internal references
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git log --format=%B "origin/${BASE_REF}..HEAD" > "${RUNNER_TEMP}/commits.txt"
          node scripts/check-internal-refs.mjs "${RUNNER_TEMP}/commits.txt"
          printf '%s' "$BODY" | node scripts/check-internal-refs.mjs --stdin
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
  # Deliberately not a required check: an advisory against a transitive dev
  # dependency would otherwise block every unrelated pull request.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
  # The action image bundles `@commitlint/config-conventional`, so this job needs
  # no install step to resolve the config named below.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The action lists the PR's commits through the API; `contents: read` alone
    # returns "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with: { configFile: .commitlintrc.json }
  # Report-only: `continue-on-error` keeps a finding or a missing license from
  # failing the run while the allow-list in `.gitleaks.toml` is proven out.
  # Findings land in the job summary and a SARIF artifact. Remove it to block.
  # The action is not run for `merge_group`, an event it rejects.
  secrets:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # The action lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required because the repository belongs to an organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
